<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Terracotta Red Gradient -->
    <linearGradient id="terracottaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A53825" />
      <stop offset="50%" stop-color="#912C1A" />
      <stop offset="100%" stop-color="#782112" />
    </linearGradient>

    <!-- Warm Gold Gradient for Accents -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#E5C287" />
      <stop offset="100%" stop-color="#C99E55" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#terracottaBg)" filter="url(#softGlow)" />
  <rect x="5.5" y="5.5" width="109" height="109" rx="24.5" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Inner Delicate Circular Seal -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#FFF5EC" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="43" fill="none" stroke="url(#goldAccent)" stroke-width="0.75" stroke-opacity="0.45" />

  <!-- Top Spring Blossom (Hoa Xuân Crest) -->
  <g id="spring-blossom" transform="translate(60, 26)">
    <!-- 5 Petals -->
    <path d="M 0,-8 C -3,-5 -3,-1 0,0 C 3,-1 3,-5 0,-8 Z" fill="url(#goldAccent)" />
    <path d="M 7.6,-2.5 C 5.5,-5.5 2,-4.5 0,0 C 3,2 6.5,0.5 7.6,-2.5 Z" fill="url(#goldAccent)" />
    <path d="M 4.7,6.5 C 6.5,3.5 4,1 0,0 C -1,3.5 1.5,6.5 4.7,6.5 Z" fill="url(#goldAccent)" />
    <path d="M -4.7,6.5 C -1.5,6.5 1,3.5 0,0 C -4,1 -6.5,3.5 -4.7,6.5 Z" fill="url(#goldAccent)" />
    <path d="M -7.6,-2.5 C -6.5,0.5 -3,2 0,0 C -2,-4.5 -5.5,-5.5 -7.6,-2.5 Z" fill="url(#goldAccent)" />
    <!-- Center Pollen Point -->
    <circle cx="0" cy="0" r="1.8" fill="#FFFBF5" />
  </g>

  <!-- Indochine Cloche / Arch Motif -->
  <path d="M 32,84 C 32,54 44,40 60,40 C 76,40 88,54 88,84" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Monogram MX (Maison Xuan) -->
  <g id="monogram" fill="#FFFDF9">
    <!-- Letter M -->
    <path d="M 38,82 L 38,52 L 44,52 L 54,72 L 60,72 L 70,52 L 76,52 L 76,82 L 70,82 L 70,61 L 62,77 L 52,77 L 44,61 L 44,82 Z" />
    <!-- Letter X subtle intersection flourish -->
    <path d="M 46,78 L 74,78" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Accent: Stars & Heritage 2006 indicator -->
  <circle cx="48" cy="94" r="1.5" fill="url(#goldAccent)" />
  <circle cx="60" cy="95" r="2.2" fill="#FFFDF9" />
  <circle cx="72" cy="94" r="1.5" fill="url(#goldAccent)" />
</svg>

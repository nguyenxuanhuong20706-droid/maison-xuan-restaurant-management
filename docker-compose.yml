services:
  # 1. Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: nhahang_postgres
    restart: unless-stopped
    ports:
      - "${HOST_PORT_DB:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-nhahang_db}
      POSTGRES_USER: ${DB_USER:-nhahang_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nhahang_password_2026}
    volumes:
      - nhahang_pgdata:/var/lib/postgresql/data
    networks:
      - nhahang_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nhahang_user} -d ${DB_NAME:-nhahang_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Quản lý Nhà hàng (Node.js Express)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhahang_web
    restart: unless-stopped
    ports:
      - "${HOST_PORT_APP:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nhahang_db}
      DB_USER: ${DB_USER:-nhahang_user}
      DB_PASSWORD: ${DB_PASSWORD:-nhahang_password_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nhahang_net

  # 3. Giao diện quản trị PostgreSQL (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nhahang_pgadmin
    restart: unless-stopped
    ports:
      - "${HOST_PORT_PGADMIN:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Admin@NhaHang2026}
    volumes:
      - nhahang_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nhahang_net

  # 4. Nginx Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    container_name: nhahang_nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT_HTTP:-8088}:80"
      - "${HOST_PORT_HTTPS:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nhahang_nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - nhahang_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 5. PostgreSQL Prometheus Exporter (Thu thập số liệu DB thực tế)
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nhahang_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-nhahang_user}:${DB_PASSWORD:-nhahang_password_2026}@db:5432/${DB_NAME:-nhahang_db}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nhahang_net

  # 6. Nginx Prometheus Exporter (Thu thập số liệu Nginx qua stub_status)
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nhahang_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx
    networks:
      - nhahang_net

  # 7. Prometheus Monitoring Server (Cổng host: 9091)
  prometheus:
    image: prom/prometheus:latest
    container_name: nhahang_prometheus
    restart: unless-stopped
    ports:
      - "${HOST_PORT_PROMETHEUS:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nhahang_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - app
      - postgres_exporter
      - nginx_exporter
    networks:
      - nhahang_net

  # 8. Grafana Dashboard & Trực quan hóa (Cổng host: 3001)
  grafana:
    image: grafana/grafana:latest
    container_name: nhahang_grafana
    restart: unless-stopped
    ports:
      - "${HOST_PORT_GRAFANA:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-Admin@NhaHang2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - nhahang_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nhahang_net

volumes:
  nhahang_pgdata:
    name: nhahang_pgdata
  nhahang_pgadmin_data:
    name: nhahang_pgadmin_data
  nhahang_nginx_logs:
    name: nhahang_nginx_logs
  nhahang_prometheus_data:
    name: nhahang_prometheus_data
  nhahang_grafana_data:
    name: nhahang_grafana_data

networks:
  nhahang_net:
    name: nhahang_net
    driver: bridge

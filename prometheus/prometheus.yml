global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # 1. Tự giám sát chính Prometheus Server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'nhahang_prometheus'

  # 2. Giám sát ứng dụng Node.js Express (Request count, Response time, Status, Business metrics)
  - job_name: 'nhahang_web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:5000']
        labels:
          service: 'nhahang_web'
          app: 'maison-xuan'

  # 3. Giám sát PostgreSQL Database qua postgres_exporter
  - job_name: 'nhahang_postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          service: 'nhahang_postgres'
          database: 'nhahang_db'

  # 4. Giám sát Nginx Reverse Proxy qua nginx-prometheus-exporter
  - job_name: 'nhahang_nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
        labels:
          service: 'nhahang_nginx'
